<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zx_Ruru Comunity</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #0a0110;
            font-family: Arial, sans-serif;
            color: white;
            scroll-behavior: smooth;
            overflow-x: hidden; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><polygon points="2,2 2,22 9,15 14,24 18,22 13,14 22,14" fill="%23a855f7" stroke="%2322c55e" stroke-width="2" stroke-linejoin="round"/></svg>') 2 2, auto !important;
        }

        a, button, .scroll-arrow-container, .menu-lateral button {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><polygon points="2,2 2,22 9,15 14,24 18,22 13,14 22,14" fill="%2322c55e" stroke="%23a855f7" stroke-width="2" stroke-linejoin="round"/></svg>') 2 2, pointer !important;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(147, 51, 234, 0.25) 1px, transparent 1px),
                linear-gradient(90deg, rgba(147, 51, 234, 0.25) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center;
            z-index: 1;
            pointer-events: none;
        }

        .grid-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(168, 85, 247, 0.15), transparent);
            animation: scanline 6s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* --- MENÚ --- */
        .menu-lateral {
            position: fixed;
            top: 20px;
            left: 0;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .menu-lateral button {
            background: linear-gradient(90deg, #4c1d95, #9333ea);
            border: 3px solid #000000;
            border-left: none; 
            color: white;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 20px 15px;
            text-align: left;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.8);
            text-transform: uppercase;
            margin-bottom: -3px; 
        }

        .menu-lateral button:hover {
            background: linear-gradient(90deg, #7e22ce, #c084fc);
            padding-left: 25px; 
            box-shadow: 6px 4px 0px rgba(0, 0, 0, 0.8);
            color: #ffffff;
            text-shadow: 2px 2px 0px #000;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .deslizador {
            display: flex;
            width: 100vw; 
            position: relative;
            z-index: 2;
        }

        .pantalla {
            width: 100vw;
            flex-shrink: 0; 
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: 200vh;
            position: relative;
            padding-left: 60px; 
            box-sizing: border-box;
        }

        /* --- DISCORD --- */
        .seccion-top {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 45px;
            width: 100%;
        }

        .titulo-pixel {
            font-family: 'Press Start 2P', monospace;
            font-size: 38px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 5px 5px 0px #a855f7;
            margin: 0;
            padding: 0 20px;
            text-align: center;
            line-height: 1.5;
        }

        .btn-discord {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background-color: #5865F2;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }

        .btn-discord:hover {
            background-color: #4752C4;
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.8);
        }

        /* --- SECCIÓN INFERIOR --- */
        .seccion-bottom {
            min-height: 120vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
            gap: 60px;
            padding-top: 40px;
            padding-bottom: 20px; 
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
        }

        .contenido-secundario {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            width: 100%;
        }

        /* --- ROOT --- */
        .titulo-root {
            font-family: 'Press Start 2P', monospace;
            font-size: 28px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px #a855f7;
            margin: 0;
            text-align: center;
            z-index: 5;
            scroll-margin-top: 80px;
        }

        .root-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 35px;
            width: 90%;
            min-height: 420px;
            padding: 40px 20px;
            box-sizing: border-box;
            background-color: rgba(25, 10, 40, 0.6);
            border: 2px solid #a855f7;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
        }

        .root-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.65));
        }

        .btn-root {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background-color: #111111;
            border: 2px solid #ffffff;
            border-radius: 10px;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }

        .btn-root:hover {
            background-color: #ffffff;
            color: #111111;
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.8);
        }

        .root-icon-button {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        /* --- REDES --- */
        .redes-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px; 
            margin-top: 100px; 
            width: 100%;
        }

        .titulo-redes {
            font-family: 'Press Start 2P', monospace;
            font-size: 28px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px #a855f7;
            margin: 0;
            text-align: center;
            z-index: 5;
            scroll-margin-top: 80px; 
        }

        .redes-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 80px;
            flex-wrap: wrap;
            width: 100%;
        }

        .perfil-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 250px;
        }

        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .avatar-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            animation: flotar 4s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container-tiktok { 
            background-color: #000000;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.8); 
        }

        .container-roblox { 
            background-color: #191b1d;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6); 
        }

        .icon-floating {
            font-size: 65px;
            color: #ffffff;
        }

        .icon-tiktok-glow {
            text-shadow: -3px -3px 0px #69c9d0, 3px 3px 0px #ee1d52;
        }

        .btn-tiktok {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #000000;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: -3px -3px 0px #69c9d0, 3px 3px 0px #ee1d52;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-tiktok:hover {
            transform: scale(1.05);
            box-shadow: -5px -5px 0px #69c9d0, 5px 5px 0px #ee1d52;
        }

        .btn-roblox {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #191b1d;
            border: 2px solid #ffffff;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-roblox:hover {
            transform: scale(1.05);
            background-color: #ffffff;
            color: #000000;
        }

        /* --- FLECHA --- */
        .scroll-arrow-container {
            position: fixed;
            right: 40px;
            bottom: 45px;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.4s ease, transform 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        @keyframes flotarFlecha {
            0% { transform: translateY(0px); }
            45% { transform: translateY(12px); }
            55% { transform: translateY(12px); }
            100% { transform: translateY(0px); }
        }

        .scroll-arrow {
            font-size: 55px; 
            color: #a855f7;
            animation: flotarFlecha 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.9));
        }

        .scroll-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px; 
            color: #a855f7;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.7);
        }

        .scroll-arrow-container:hover .scroll-arrow {
            color: #c084fc;
        }

        .scroll-arrow-container.hidden {
            opacity: 0;
            transform: translateY(30px);
            pointer-events: none;
        }

        /* --- CONTADOR --- */
        .contador-visitas {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            width: 100%;
            letter-spacing: 1px;
            margin-top: 40px;
            text-shadow: 0 0 5px rgba(168, 85, 247, 0.3);
        }

        .contador-visitas span {
            color: #a855f7;
            font-weight: bold;
        }

        /* --- ESQUELETO --- */
        .esqueleto-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: flotar 3s ease-in-out infinite;
            pointer-events: none;
        }

        .esqueleto-icon {
            font-size: 65px;
            color: #a855f7; 
            text-shadow: 
                -3px -3px 0 #000,
                 3px -3px 0 #000,
                -3px  3px 0 #000,
                 3px  3px 0 #000,
                 5px  5px 0 rgba(0,0,0,0.8); 
        }

        .speech-bubble {
            background: #130321;
            border: 3px solid #a855f7;
            color: white;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 4px 4px 0px #000000;
            max-width: 200px;
            text-align: center;
            line-height: 1.5;
            position: relative;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: #a855f7 transparent transparent transparent;
        }
    </style>
</head>

<body>

    <div class="grid-bg"></div>

    <!-- MENÚ LATERAL -->
    <nav class="menu-lateral">
        <button onclick="scrollToSection('seccion-discord')">DISCORD</button>
        <button onclick="scrollToSection('seccion-root')">ROOT</button>
        <button onclick="scrollToSection('seccion-redes')">REDES</button>
    </nav>

    <!-- ESQUELETO -->
    <div class="esqueleto-container">
        <div class="speech-bubble" id="burbuja-texto">¡Únete al Discord!</div>
        <i class="fa-solid fa-skull esqueleto-icon"></i>
    </div>

    <!-- CONTENIDO -->
    <div class="deslizador" id="deslizador">

        <div class="pantalla principal">

            <div class="wrapper">

                <!-- DISCORD -->
                <div class="seccion-top" id="seccion-discord">

                    <h1 class="titulo-pixel">
                        Zx_Ruru Comunity
                    </h1>

                    <a href="https://discord.gg/GzfUbcRrQM"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="btn-discord">

                        <i class="fa-brands fa-discord"></i>
                        Discord

                    </a>

                </div>

                <!-- SECCIÓN INFERIOR -->
                <div class="seccion-bottom">

                    <div class="contenido-secundario">

                        <!-- ROOT -->
                        <h2 class="titulo-root" id="seccion-root">
                            ROOT
                        </h2>

                        <div class="root-wrapper">

                            <img
                                class="root-logo"
                                src="https://cdn.prod.website-files.com/6792bf217e6993766175e274/6838b4a94a8039d055a2fc4c_Logo%20%281%29.svg"
                                alt="Root"
                            >

                            <a
                                href="https://rootapp.gg/ADG9ijuaiQqLi6-T9xwoVg"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="btn-root"
                            >

                                <img
                                    class="root-icon-button"
                                    src="https://cdn.prod.website-files.com/6792bf217e6993766175e274/6838b4a94a8039d055a2fc4c_Logo%20%281%29.svg"
                                    alt=""
                                >

                                Entrar a Root

                            </a>

                        </div>

                        <!-- REDES -->
                        <div class="redes-wrapper">

                            <h2 class="titulo-redes" id="seccion-redes">
                                REDES
                            </h2>

                            <div class="redes-container">

                                <!-- TIKTOK -->
                                <div class="perfil-card">

                                    <div class="avatar-container container-tiktok">

                                        <i class="fa-brands fa-tiktok icon-floating icon-tiktok-glow"></i>

                                    </div>

                                    <a
                                        href="https://www.tiktok.com/@zx_deep"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="btn-tiktok"
                                    >

                                        <i class="fa-brands fa-tiktok"></i>
                                        TikTok

                                    </a>

                                </div>

                                <!-- ROBLOX -->
                                <div class="perfil-card">

                                    <div class="avatar-container container-roblox">

                                        <i class="fa-solid fa-cube icon-floating"></i>

                                    </div>

                                    <a
                                        href="https://www.roblox.com/es/users/4049770594/profile"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        class="btn-roblox"
                                    >

                                        <i class="fa-solid fa-cube"></i>
                                        Roblox

                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- CONTADOR -->
                    <div class="contador-visitas">

                        VISITAS:
                        <span id="numero-visitas">
                            Cargando...
                        </span>

                    </div>

                </div>

            </div>

            <!-- FLECHA -->
            <div
                class="scroll-arrow-container"
                id="scrollArrow"
                onclick="scrollToSection('seccion-root')"
            >

                <i class="fa-solid fa-angles-down scroll-arrow"></i>

                <span class="scroll-text">
                    Scroll
                </span>

            </div>

        </div>

    </div>

    <script>

        /* --- SCROLL DEL MENÚ --- */
        function scrollToSection(id) {

            const section = document.getElementById(id);

            if (section) {

                section.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });

            }

        }


        /* --- FLECHA DE SCROLL --- */
        window.onscroll = function() {

            const arrow = document.getElementById('scrollArrow');

            if (
                document.body.scrollTop > 100 ||
                document.documentElement.scrollTop > 100
            ) {

                arrow.classList.add('hidden');

            } else {

                arrow.classList.remove('hidden');

            }

        };


        /* --- CONTADOR DE VISITAS --- */
        function inicializarContador() {

            const numeroVisitasEl =
                document.getElementById('numero-visitas');

            fetch(
                'https://api.countapi.xyz/hit/zx_ruru_comunity_counter/visits'
            )

            .then(res => res.json())

            .then(data => {

                if (data.value) {

                    numeroVisitasEl.textContent = data.value;

                } else {

                    fallBackLocalCounter(numeroVisitasEl);

                }

            })

            .catch(() => {

                fallBackLocalCounter(numeroVisitasEl);

            });

        }


        /* --- CONTADOR LOCAL DE RESPALDO --- */
        function fallBackLocalCounter(elemento) {

            let visitas =
                localStorage.getItem('visitas_locales');

            if (!visitas) {

                visitas = 1;

            } else {

                visitas = parseInt(visitas) + 1;

            }

            localStorage.setItem(
                'visitas_locales',
                visitas
            );

            elemento.textContent =
                parseInt(visitas) + 1240;

        }


        document.addEventListener(
            'DOMContentLoaded',
            inicializarContador
        );


        /* --- FRASES DEL ESQUELETO --- */
        const frasesEsqueleto = [

            "¡Somos +300 personas!",

            "¡Guau, el Discord está muy activo!",

            "¡Unete para reclamar premios!",

            "¡Me encanta el color morado!",

            "¿Ya estás en Root?"

        ];


        const burbujaTexto =
            document.getElementById('burbuja-texto');

        let indiceFrase = 0;


        setInterval(() => {

            burbujaTexto.style.opacity = 0;

            setTimeout(() => {

                indiceFrase =
                    (indiceFrase + 1) %
                    frasesEsqueleto.length;

                burbujaTexto.textContent =
                    frasesEsqueleto[indiceFrase];

                burbujaTexto.style.opacity = 1;

            }, 500);

        }, 4000);

    </script>

</body>
</html>
